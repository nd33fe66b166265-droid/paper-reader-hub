# テストを動かし、main のときは hub/ を GitHub Pages に公開する。
# 初回だけ: リポジトリの Settings → Pages → Build and deployment → Source を「GitHub Actions」にする。
name: test-and-deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: テストの準備
        working-directory: tests
        run: |
          npm ci
          python3 gen_fixtures.py
      - name: テスト
        working-directory: tests
        run: HUB=$PWD/../hub/index.html sh run_all.sh

  # 公開するファイルをまとめる（成果物 github-pages）。
  # 公開（deploy）と同じジョブでまとめると、まとめた直後の成果物を GitHub がまだ見つけられず
  # 「No artifacts named "github-pages"」で失敗することがあったので、ジョブを分けている。
  # 失敗したときは「Re-run failed jobs」ではなく「Re-run all jobs」か、Actions の「Run workflow」で新しく動かす。
  build:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: hub

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
